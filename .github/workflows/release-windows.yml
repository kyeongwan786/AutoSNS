name: Build and publish Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set public app configuration
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $settings = Get-Content cloud_settings.json -Raw | ConvertFrom-Json
          $settings.app_version = $version
          $settings = $settings | ConvertTo-Json -Depth 5
          Set-Content -Path cloud_settings.json -Value $settings -Encoding utf8
      - name: Build EXE
        run: .\build_windows.bat
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist\AutoSNS.exe" --generate-notes
